name: notify-release
on:
  release:
    types: [published]

permissions: {}

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: mattermost/action-mattermost-notify@ae31bb6f9e26a54336e79696f108a2c91cf55b4e # v2.1.0
        with:
          MATTERMOST_WEBHOOK_URL: ${{ secrets.MATTERMOST_WEBHOOK_URL }}
          MATTERMOST_USERNAME: Cloud Bot Notify
          MATTERMOST_ICON_URL: https://www.mattermost.org/wp-content/uploads/2016/04/icon.png
          TEXT: |
            # **New Release for ${{ github.repository }}** - Release [${{ github.event.release.tag_name }}](${{ github.event.release.html_url }})
            ${{ github.event.release.body }}
